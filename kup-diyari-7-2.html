p{margin:6px 0;font-size:15px;line-height:1.35}
#go{margin-top:14px;font:700 22px 'Baloo 2',sans-serif;padding:10px 34px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}

#homehint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);display:none;padding:8px 14px;border-radius:12px;background:rgba(20,30,70,.78);color:#fff;font-weight:800;text-shadow:0 2px 4px #000;z-index:3}

      html+=`<div class="it" data-pack="${i}"><div class="sw" style="background:linear-gradient(#86efac,#22c55e)"></div>${p.e} ${p.n}<br><small>${p.desc}</small></div>`;
    });
    html+='</div>';
    $('pd').innerHTML=html;
    $('pd').querySelectorAll('.it[data-i]').forEach(e=>e.onclick=()=>{window.trySetChar(+e.dataset.i)});
    $('pd').querySelectorAll('.it[data-pack]').forEach(e=>e.onclick=()=>{
      const p=MONEY_PACKS[+e.dataset.pack];
      if(!confirm(p.n+' paketini satın al?\n'+p.desc+'\n\n(Demo: ödeme simülasyonu — para anında yüklenir)'))return;
      money+=p.gain;saveGame();
      toast(p.e+' +$'+p.gain.toLocaleString('en-US')+' yüklendi!');
      window.renderCh();
    });
  };

  window.fullRestart=function(){
    if(!confirm('Tüm ilerlemen silinecek (para, envanter, konum, premium karakterler). Emin misin?'))return;
    try{localStorage.removeItem('kd_game_v3')}catch(e){}
    money=1000;inv=starter();sel=5;hp=20;pt=360;ph='day';planeClock=180;
    sleeping=false;sitting=false;if(riding){riding=null}
    unlockedCh=[0,1,2,3,4,5];chI=0;setChar(0);saveSet();
    pl.p.copy(P0);pl.v.set(0,0,0);pl.peak=P0.y;yaw=0;pitch=0;
    for(let i=ents.length-1;i>=0;i--)if(ents[i].pet){scene.remove(ents[i].g);ents.splice(i,1)}
    hb();saveGame();toast('Oyun yeniden başlatıldı');
    $('menu').style.display='flex';state='menu';tab('o');
    $('mt').textContent='Küp Diyarı';$('mm').textContent='Yeni bir maceraya başla.';$('go').textContent='Başla';
  };

  const saveGame=()=>{
    try{
      localStorage.setItem('kd_game_v3',JSON.stringify({
        money,inv,sel,hp,ph,pt,px:pl.p.x,py:pl.p.y,pz:pl.p.z,yaw,pitch,chI,unlockedCh,
        time:Date.now()
      }));
    }catch(e){}
  };
  const loadGame=()=>{
    try{
      const g=JSON.parse(localStorage.getItem('kd_game_v3')||'null');
      if(!g)return;
      if(typeof g.money==='number')money=g.money;
      if(g.inv&&typeof g.inv==='object')inv=g.inv;
      if(g.sel!=null)sel=g.sel;
      if(typeof g.hp==='number')hp=Math.max(1,Math.min(20,g.hp));
      if(g.ph==='day'||g.ph==='night')ph=g.ph;
      if(typeof g.pt==='number')pt=Math.max(1,g.pt);
      if(Array.isArray(g.unlockedCh)){unlockedCh=g.unlockedCh;saveSet()}
      if([g.px,g.py,g.pz].every(Number.isFinite)){
        const lx=g.px,lz=g.pz,ty=(typeof topY==='function')?topY(Math.floor(lx),Math.floor(lz)):g.py;
        let ly=g.py;
        if(!Number.isFinite(ly)||ly<ty-2||ly>ty+40)ly=ty+1.2;
        pl.p.set(lx,ly,lz);
      }
      if(Number.isFinite(g.yaw))yaw=g.yaw;
      if(Number.isFinite(g.pitch))pitch=g.pitch;
      if(Number.isInteger(g.chI)&&unlockedCh.includes(g.chI))setChar(g.chI);
      toast('Dünyan ve paran kaydedildi.');
      hb();
    }catch(e){}
  };

  function spawnPet(kind,label){
    const L=(c,w,b)=>({n:kind,hp:28,hw:.45,h:1.2,sp:2.2,meat:0,sc:1,pet:1,lg:[...mir([.14,.4,.14,b,.22,.42,.3]),...mir([.14,.4,.14,b,.22,.42,-.3])],p:[[.6,.5,1,c,0,.7,0],[.4,.35,.4,w,0,.95,.5],...EY(.12,.95,.65)]});
    const defs={
      deve:{n:'deve',hp:30,hw:.5,h:1.6,sp:2.0,meat:0,sc:1.1,pet:1,lg:[...mir([.22,.55,.22,'#b8860b',.28,.55,.4]),...mir([.22,.55,.22,'#b8860b',.28,.55,-.4])],p:[[.9,.7,1.5,'#ffd700',0,.95,0],[.5,.55,.5,'#ffec8b',0,1.35,.9],[.15,.35,.15,'#b8860b',0,1.5,1.15],...EY(.18,1.4,1.15)]},
      kurt:L('#2d2d44','#1a1a2e','#111'),
      anka:{n:'anka',hp:25,hw:.35,h:1.2,sp:2.4,meat:0,sc:1,pet:1,lg:[],p:[[.3,.25,.5,'#67e8f9',0,.7,0],[.8,.08,.4,'#a78bfa',0,.75,0],[.2,.2,.2,'#f0abfc',0,.95,.25],...EY(.08,.95,.35)]},
      ejder:{n:'ejder',hp:40,hw:.6,h:1.5,sp:2.1,meat:0,sc:1.2,pet:1,lg:[...mir([.2,.5,.2,'#0369a1',.3,.55,.4]),...mir([.2,.5,.2,'#0369a1',.3,.55,-.4])],p:[[1,.7,1.6,'#38bdf8',0,1,0],[.5,.4,.5,'#e0f2fe',0,1.35,.9],[.2,.15,.35,'#0369a1',0,1.3,1.2],...EY(.15,1.4,1.15)]},
      aslan:L('#ea580c','#fed7aa','#9a3412'),ayi:L('#7dd3fc','#e0f2fe','#0369a1'),
      at:L('#a78bfa','#ddd6fe','#5b21b6'),panter:L('#7c3aed','#2e1065','#1e1b4b'),
      robot:L('#94a3b8','#e2e8f0','#334155'),balina:L('#38bdf8','#e0f2fe','#0c4a6e'),
      tilki:L('#f97316','#ffedd5','#9a3412'),penguen:L('#1e293b','#f8fafc','#0f172a'),
      kartal:L('#fbbf24','#fef3c7','#92400e'),yilan:L('#4ade80','#dcfce7','#14532d'),
      baykus:L('#44403c','#a8a29e','#1c1917'),kopek:L('#dc2626','#fecaca','#7f1d1d'),
      tavsan:L('#f9a8d4','#fce7f3','#9d174d'),ahtapot:L('#a855f7','#ede9fe','#581c87'),
      boga:L('#ca8a04','#fef08a','#713f12'),kaplumbaga:L('#14b8a6','#ccfbf1','#134e4a')
    };
    const d=defs[kind];if(!d){toast('Pet yüklenemedi');return}
    for(let i=ents.length-1;i>=0;i--)if(ents[i].pet&&ents[i].d.n===d.n){scene.remove(ents[i].g);ents.splice(i,1)}
    const e=mk(d,pl.p.x+1.5,pl.p.y+.2,pl.p.z+1.5);e.pet=1;e.ch=false;e.loyal=1;
    toast((label||kind)+' sadık dostun oldu! Yanından ayrılmaz.');
  }

  function ecoOpen(mode){
    economyMode=mode;
    $('ecoTitle').textContent=mode==='market'?'🛒 Mağaza':'🔄 Takas Yeri';
    $('ecoSub').textContent=mode==='market'
      ?'Yiyecek ve özel hayvanlar / efsane eşyalar al.'
      :'Ekmek ve et satarak para kazan; kazandığın parayla alışveriş yap.';
    $('moneyText').textContent='$'+money.toLocaleString('en-US');
    const g=$('ecoGrid'); g.innerHTML='';
    if(mode==='trade'){
      Object.entries(SALE).forEach(([id,p])=>{
        const d=INFO[id][0];
        const el=document.createElement('div');el.className='ecoi';
        el.innerHTML=`<b>📦 ${d}</b><br>Satış: $${p}<br><small>Envanter: ${inv[id]||0}</small><button>Sat</button>`;
        el.querySelector('button').onclick=()=>{
          if((inv[id]||0)<=0){toast('Satacak ürünün yok.');return}
          inv[id]--;money+=p;hb();ecoOpen('trade');saveGame();toast(`${d} sattın: +$${p}`);
        };g.appendChild(el);
      });
      Object.values(FOOD).forEach(f=>{
        const el=document.createElement('div');el.className='ecoi';
        el.innerHTML=`<b>${f.e} ${f.n}</b><br>Fiyat: $${f.p}<button>Satın al</button>`;
        el.querySelector('button').onclick=()=>buyFood(f);g.appendChild(el);
      });
    }else{
      Object.values(FOOD).forEach(f=>{
        const el=document.createElement('div');el.className='ecoi';
        el.innerHTML=`<b>${f.e} ${f.n}</b><br>Fiyat: $${f.p.toLocaleString('en-US')}<br><small>Envanter: ${inv[Object.keys(FOOD).find(k=>FOOD[k]===f)]||0}</small><button>Satın al</button>`;
        el.querySelector('button').onclick=()=>buyFood(f);
        g.appendChild(el);
      });
      SPECIAL.forEach(s=>{
        const el=document.createElement('div');el.className='ecoi';
        el.innerHTML=`<b>${s.e} ${s.n}</b><br>Fiyat: <b>$${s.p.toLocaleString('en-US')}</b><br><small>${s.desc}</small><button>Satın al</button>`;
        el.querySelector('button').onclick=()=>buySpecial(s);
        g.appendChild(el);
      });
    }
    $('eco').style.display='flex';
  }
  function buyFood(f){
    if(money<f.p){toast('Yeterli paran yok.');return}
    const id=+Object.keys(FOOD).find(k=>FOOD[k]===f);
    money-=f.p;inv[id]=(inv[id]||0)+1;sel=id;hb();ecoOpen(economyMode);saveGame();toast(`${f.n} aldın!`);
  }
  function buySpecial(s){
    if(money<s.p){toast('Yeterli paran yok. $'+s.p.toLocaleString('en-US')+' gerekli');return}
    money-=s.p;
    if(s.kind==='pet'){
      inv[s.id]=(inv[s.id]||0)+1;hb();
      spawnPet(s.pet||'kurt',s.n);
    }else if(s.kind==='chest'){
      const lo=s.lo||5000,hi=s.hi||15000;
      const gain=lo+Math.floor(Math.random()*(hi-lo+1));
      money+=gain;toast(`${s.e} Sandık: +$${gain.toLocaleString('en-US')}!`);
    }else{
      inv[s.id]=(inv[s.id]||0)+1;sel=s.id;hb();toast(s.n+' envantere eklendi!');
    }
    ecoOpen(economyMode);saveGame();
  }
  $('marketBtn').onclick=()=>ecoOpen('market');
  $('tradeBtn').onclick=()=>ecoOpen('trade');
  $('ecoClose').onclick=()=>$('eco').style.display='none';
  $('eco').addEventListener('pointerdown',e=>{if(e.target===$('eco'))$('eco').style.display='none'});

  const oldTap=window.tap;
  window.tap=function(){
    if($('eco').style.display==='flex'||$('chatbox').style.display==='flex')return;
    const food=FOOD[sel];
    if(food){
      if((inv[sel]||0)>0){
        hp=Math.min(20,hp+food.h);inv[sel]--;if(typeof hb==='function')hb();saveGame();
        toast(`${food.n} yedin. +${food.h} can`);
      }
      return;
    }
    if(typeof oldTap==='function')oldTap();
  };

  function nearestVillager(){
    let best=null,bd=7;
    for(const e of ents){
      if(!e.d.npc)continue;
      const d=Math.hypot(e.p.x-pl.p.x,e.p.z-pl.p.z);
      if(d<bd){bd=d;best=e}
    }
    return best;
  }
  function npcReply(q){
    const t=q.toLocaleLowerCase('tr-TR');
    const n=nearestVillager();
    if(!n)return 'Yakınımda bir köylü yok. Bir köylünün yanına gel.';
    if(/ekmek|ekmek var mı|ekmeğin var mı/.test(t)){
      if((inv[21]||0)<1){inv[21]=(inv[21]||0)+1;hb();saveGame();return 'Evet, elimde bir tane var. Al sana, vereyim! 🥖';}
      return 'Bende de ekmek var. İstersen takas yerinden satıp para kazanabilirsin.';
    }
    if(/merhaba|selam|hello/.test(t))return 'Merhaba! Ben buranın köylüsüyüm. Ne arıyorsun?';
    if(/market|mağaza|magaza/.test(t))return 'Mağazada Adana dürüm, lahmacun, ayran, kola, pizza, waffle ve hamburger bulabilirsin.';
    if(/takas|sat|para/.test(t))return 'Ekmek ve etlerini takas yerinde satabilirsin. Başlangıç paran $1.000.';
    if(/zombi|gece/.test(t))return 'Gece 6 dakika sürüyor. Zombiler ve vampirler daha sık ortaya çıkıyor; bir eve sığın!';
    if(/okyanus|deniz|gemi/.test(t))return 'Okyanus her yerde değil. Uzaklara gidersen sonsuz deniz bölgesine ve gemi batıklarına rastlayabilirsin.';
    if(/ev|evim/.test(t))return 'Evinin içinde üstte “Kendi evini tasarla” yazısını göreceksin. Gece bir evde en fazla 1 dakika 20 saniye kalabilirsin; gündüz sınır yok.';
    if(/asansör|kat/.test(t))return 'Villalarda 2-3 katlı asansörler bulunabilir. Üst kat düğmesine bas!';
    if(/yardım|yardim|ne yap/.test(t))return 'Blok topla, evini tasarla, yiyecek satıp para kazan ve okyanusta gemi ara.';
    return 'Bunu anladım. Bana ekmek, market, takas, ev, asansör, okyanus veya gece hakkında sorabilirsin.';
  }
  function chatOpen(){
    const n=nearestVillager();
    if(!n){toast('Konuşmak için yakındaki köylüye yaklaş.');return}
    $('chatbox').style.display='flex';
    if(!$('chatlog').children.length)$('chatlog').innerHTML='<div class="msg npcmsg">Köylü: Merhaba! Bana bir şey sorabilirsin.</div>';
    $('chatInput').focus();
  }
  function sendChat(){
    const input=$('chatInput'),q=input.value.trim();if(!q)return;
    if(!nearestVillager()){chatClose();toast('Köylü senden uzaklaştı.');return}
    $('chatlog').insertAdjacentHTML('beforeend',`<div class="msg youmsg">Sen: ${q.replace(/[<>]/g,'')}</div>`);
    const ans=npcReply(q);$('chatlog').insertAdjacentHTML('beforeend',`<div class="msg npcmsg">Köylü: ${ans}</div>`);
    $('chatlog').scrollTop=$('chatlog').scrollHeight;input.value='';
  }
  function chatClose(){$('chatbox').style.display='none'}
  $('chatBtn').onclick=chatOpen;$('chatClose').onclick=chatClose;$('chatSend').onclick=sendChat;
  $('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});


  // Okyanusta gemiler: 10 farklı renkte gemi + batıklar
  if(typeof D!=='undefined'&&D){
  D.gemi=makeShipDef(SHIP_COLS[0]);
  const wrecks=[];
  function addWreck(x,y,z,rot){
    const g=new THREE.Group();
    const mm=c=>new THREE.MeshLambertMaterial({color:c});
    const add=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mm(c));m.position.set(px,py,pz);g.add(m)};
    add(2,.35,5,'#4b3429',0,0,0);add(1.5,.25,3.5,'#6b4732',0,.35,0);
    add(.16,2.4,.16,'#3a2b26',0,1.5,0);add(1.2,.08,.08,'#d9d0b6',0,2.25,.1);
    add(.9,.8,.08,'#8c7b62',0,1.65,.15);g.position.set(x,y,z);g.rotation.y=rot;g.rotation.z=.12;scene.add(g);wrecks.push(g);
  }
  function spawnBoatsAndWrecks(){
    try{
      if(typeof mk!=='function'||typeof makeShipDef!=='function')return;
      const boats=ents.filter(e=>e.d&&e.d.n==='gemi');
      let need=Math.min(2,10-boats.length); // her seferde en fazla 2 (donmayı önler)
      for(let n=0;n<need;n++){
        let placed=false;
        for(let k=0;k<30&&!placed;k++){
          const a=Math.random()*6.28,r=35+Math.random()*100,x=Math.floor(pl.p.x+Math.cos(a)*r),z=Math.floor(pl.p.z+Math.sin(a)*r);
          if(!Number.isFinite(x)||!Number.isFinite(z))continue;
          const dp=SL-hgt(x,z);if(dp<5)continue;
          const col=SHIP_COLS[(boats.length+n)%SHIP_COLS.length];
          const e=mk(makeShipDef(col),x+.5,SL-.55,z+.5);e.shipColor=col;placed=true;
        }
      }
      if(wrecks.length<3){
        for(let k=0;k<24;k++){
          const a=Math.random()*6.28,r=55+Math.random()*130,x=Math.floor(pl.p.x+Math.cos(a)*r),z=Math.floor(pl.p.z+Math.sin(a)*r);
          if(!Number.isFinite(x)||!Number.isFinite(z))continue;const dp=SL-hgt(x,z);if(dp<7)continue;
          addWreck(x+.5,SL-3.0,z+.5,Math.random()*6.28);break;
        }
      }
    }catch(err){console.warn('gemi spawn',err)}
  }
  setTimeout(()=>{if(typeof state!=='undefined'&&state==='play')spawnBoatsAndWrecks()},1200);
  setInterval(()=>{if(typeof state!=='undefined'&&state==='play')spawnBoatsAndWrecks()},7000);
  }

  // Köylünün doğrudan tıklanması da akıllı konuşma panelini açar.
  const oldHitEnt=window.hitEnt;
  window.hitEnt=function(a){
    if(a&&a.d&&a.d.npc){chatOpen();return}
    if(typeof oldHitEnt==='function')return oldHitEnt(a);
  };

  // Ev süresi: mevcut oluşturulan ev kutularından oyuncunun içinde olduğu evi bul.
  function updateHomeTimer(dt){
    let inside=null;
    for(const h of HP){
      const [x,z,w,d,F,o]=h;
      const ground=hgt(x+Math.floor(w/2),z+Math.floor(d/2));
      const roof=topY(x+Math.floor(w/2),z+Math.floor(d/2));
      if(pl.p.x>=x+1&&pl.p.x<=x+w-1&&pl.p.z>=z+1&&pl.p.z<=z+d-1&&pl.p.y>=ground+1&&pl.p.y<=roof+1){inside=h;break}
    }
    if(!inside){homeInside=false;homeKey=null;homeSeconds=0;homeHintT=0;$('homehint').style.display='none';return}
    const key=inside[0]+','+inside[1]+','+inside[2]+','+inside[3];
    if(homeKey!==key){homeKey=key;homeSeconds=0;homeHintT=4}
    homeInside=true;
    if(ph==='night'){
      homeSeconds+=dt;
      if(homeSeconds>=80){
        toast('Ev süren doldu! Gece 1 dakika 20 saniye tamamlandı.');
        const [x,z,w,d]=inside;
        pl.p.set(x-2,hgt(x-2,z+Math.floor(d/2))+1,z+d/2);pl.v.set(0,0,0);
        homeKey=null;homeSeconds=0;homeInside=false;homeHintT=0;$('homehint').style.display='none';
        return;
      }
      // İlk 4 sn veya son 20 sn kala göster (süre uyarısı)
      const left=80-homeSeconds;
      if(homeHintT>0||left<=20){
        if(homeHintT>0)homeHintT-=dt;
        $('homehint').style.display='block';
        $('homehint').innerHTML='🏠 Kendi evini tasarla • Gece evde kalan süre: <span id="homeTimer">'+Math.max(0,Math.ceil(left))+'</span>s';
      }else{
        $('homehint').style.display='none';
      }
    }else{
      homeSeconds=0;
      if(homeHintT>0){
        homeHintT-=dt;
        $('homehint').style.display='block';
        $('homehint').innerHTML='🏠 Kendi evini tasarla • Gündüz istediğin kadar kalabilirsin';
      }else{
        $('homehint').style.display='none';
      }
    }
  }

  // Kayıt: konum, para, envanter, can, zaman, karakter.
  const oldLoop=window.loop;
  // loop içinden ayrı bir hafif kayıt saati; oyun akışını değiştirmez.
  let saveT=0,lastSave=performance.now();
  setInterval(()=>{if(typeof state!=='undefined'&&state==='play')saveGame()},5000);

  // Ev zamanını mevcut render döngüsünden bağımsız güvenli bir saatle güncelle.
  setInterval(()=>{
    if(typeof state!=='undefined'&&state==='play'){
      const now=performance.now(),dt=Math.min(.25,(now-lastSave)/1000);lastSave=now;
      updateHomeTimer(dt);
    }
  },250);

  window.addEventListener('beforeunload',saveGame);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});

  // Oyun açıldığında eski kaydı geri yükle.
  setTimeout(()=>{loadGame();if(typeof money==='number')$('moneyText').textContent='$'+money.toLocaleString('en-US')},0);
})();
</script>
</body>
